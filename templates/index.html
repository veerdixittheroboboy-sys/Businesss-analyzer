<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VentureScan - AI Business & Market Research</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Marked.js converts Markdown to clean HTML in the browser -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6 font-sans">
  <div class="max-w-4xl mx-auto space-y-6">
    
    <header class="text-center py-6">
      <h1 class="text-3xl font-extrabold tracking-tight text-indigo-400">VentureScan</h1>
      <p class="text-slate-400 mt-2">Turn raw concepts into in-depth business plans and market analyses.</p>
    </header>

    <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-xl space-y-4">
      <label for="ideaInput" class="block font-semibold text-slate-200">Describe your idea or product:</label>
      <textarea id="ideaInput" rows="5" placeholder="e.g., Popcorn business" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-3 text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
      
      <button id="submitBtn" onclick="analyzeIdea()" class="w-full bg-indigo-600 hover:bg-indigo-500 transition-colors font-medium py-3 rounded-lg flex justify-center items-center gap-2">
        <span id="btnText">Generate Market Analysis</span>
        <div id="loader" class="hidden w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
      </button>
    </div>

    <!-- Output Section -->
    <div id="resultCard" class="hidden bg-slate-900 border border-slate-800 rounded-xl p-8 leading-relaxed space-y-4 shadow-xl">
      <div id="outputContent" class="text-slate-200 space-y-3"></div>
    </div>

  </div>

  <script>
    async function analyzeIdea() {
      const idea = document.getElementById("ideaInput").value;
      const btn = document.getElementById("submitBtn");
      const btnText = document.getElementById("btnText");
      const loader = document.getElementById("loader");
      const resultCard = document.getElementById("resultCard");
      const outputContent = document.getElementById("outputContent");

      if (!idea.trim()) return alert("Please provide an idea first.");

      btn.disabled = true;
      btnText.innerText = "Analyzing Market & Economics...";
      loader.classList.remove("hidden");

      try {
        const res = await fetch("/analyze", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ idea: idea })
        });
        const data = await res.json();

        if (res.ok) {
          // Parse Markdown in the browser safely
          outputContent.innerHTML = marked.parse(data.result);
          resultCard.classList.remove("hidden");
        } else {
          alert(data.error || "Analysis failed.");
        }
      } catch (err) {
        alert("Server error. Check terminal output.");
      } finally {
        btn.disabled = false;
        btnText.innerText = "Generate Market Analysis";
        loader.classList.add("hidden");
      }
    }
  </script>
</body>
</html>
